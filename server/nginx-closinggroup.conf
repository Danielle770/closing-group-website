# Add these blocks INSIDE the existing `server { ... }` block for closinggroupisrael.com
# (the HTTPS one), then run: nginx -t && systemctl reload nginx

    # Sign-up API -> Node service on this machine
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }

    # Analytics (PostHog US) through our own domain, so the site's security policy stays 'self'
    # and privacy blockers don't drop the data. Path is deliberately not called "analytics".
    location ^~ /cgx/static/ {
        proxy_pass https://us-assets.i.posthog.com/static/;
        proxy_set_header Host us-assets.i.posthog.com;
        proxy_ssl_server_name on;
    }
    location ^~ /cgx/array/ {
        proxy_pass https://us-assets.i.posthog.com/array/;
        proxy_set_header Host us-assets.i.posthog.com;
        proxy_ssl_server_name on;
    }
    location ^~ /cgx/ {
        proxy_pass https://us.i.posthog.com/;
        proxy_set_header Host us.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # keeps visitor country/city accurate
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;                                       # session replays send larger batches
    }

    # Never serve the server code, git data or hidden files from the website folder
    location ^~ /server/ { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; return 404; }
    location = /README.md { deny all; return 404; }

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
