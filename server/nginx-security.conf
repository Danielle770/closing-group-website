# The Closing Group: security headers. Included inside the HTTPS server block for closinggroupisrael.com.
# Installed by server/harden-nginx.sh. Keep this list in step with the outside sources the pages load.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://us-assets.i.posthog.com https://us.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.pexels.com https://images.unsplash.com https://us.posthog.com; connect-src 'self' https://us.posthog.com https://us.i.posthog.com https://us-assets.i.posthog.com; worker-src 'self' blob:; media-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
